name: Agent maintenance

on:
  push:
    branches:
      - agent/fix-python-ci

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply Ruff formatting
        run: |
          python -m pip install 'ruff==0.16.2'
          ruff format backend/tests/conftest.py backend/tests/test_backup_runner.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Refresh audited npm lockfile
        working-directory: frontend
        run: npm audit fix --package-lock-only

      - name: Commit generated repairs
        run: |
          if git diff --quiet; then
            echo 'No generated changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests/conftest.py backend/tests/test_backup_runner.py frontend/package-lock.json
          git commit -m 'fix(ci): refresh formatting and audited lockfile'
          git push origin HEAD:${{ github.ref_name }}
